name: Sync upstream (code + releases)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync code and tags from upstream
        env:
          UPSTREAM_REPO: librespeed/speedtest-go
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags --prune --force
          DEFAULT_BRANCH=$(gh repo view "${{ github.repository }}" --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "Default branch: ${DEFAULT_BRANCH}"
          git checkout "${DEFAULT_BRANCH}"
          if git merge "upstream/${DEFAULT_BRANCH}" --no-edit -m "chore: sync upstream ${DEFAULT_BRANCH}"; then
            echo "Code sync: merged cleanly"
          else
            echo "Code sync: conflict detected, taking upstream version"
            git checkout --theirs .
            git add -A
            git commit -m "chore: sync upstream ${DEFAULT_BRANCH} (theirs)" || true
          fi
          git push origin "${DEFAULT_BRANCH}"
          git push origin --tags

      - name: Sync releases from upstream
        env:
          UPSTREAM_REPO: librespeed/speedtest-go
        run: |
          set -euo pipefail
          TARGET="${{ github.repository }}"
          TMP_DIR=$(mktemp -d)
          gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" --jq '.[] | @base64' > "${TMP_DIR}/upstream.txt"
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            REL=$(echo "${line}" | base64 -d)
            TAG=$(echo "${REL}" | jq -r .tag_name)
            NAME=$(echo "${REL}" | jq -r .name)
            PRERELEASE=$(echo "${REL}" | jq -r .prerelease)
            BODY=$(echo "${REL}" | jq -r .body)
            if gh release view "${TAG}" -R "${TARGET}" >/dev/null 2>&1; then
              echo "skip (exists): ${TAG}"
              continue
            fi
            mkdir -p "${TMP_DIR}/assets"
            gh release download "${TAG}" -R "${UPSTREAM_REPO}" -D "${TMP_DIR}/assets" --clobber || true
            ASSETS=()
            for f in "${TMP_DIR}"/assets/*; do
              [ -f "$f" ] && ASSETS+=("$f")
            done
            ARGS=()
            [ -n "${NAME}" ] && ARGS+=(--title "${NAME}")
            [ -n "${BODY}" ] && ARGS+=(--notes "${BODY}")
            if [ "${PRERELEASE}" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release create "${TAG}" -R "${TARGET}" "${ARGS[@]}" "${ASSETS[@]}"
            else
              gh release create "${TAG}" -R "${TARGET}" "${ARGS[@]}"
            fi
            echo "created: ${TAG} (assets: ${#ASSETS[@]})"
          done < "${TMP_DIR}/upstream.txt"
